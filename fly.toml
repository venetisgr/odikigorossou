# Ανάπτυξη στο Fly.io:  fly launch --no-deploy  (μία φορά)  →  fly secrets set LLM_API_KEY=…  →  fly deploy
app = "odikigorossou"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 120

[build]
  # [build.args]
  #   CORPUS_REF = "<commit του lexifina/greece-law>"

[env]
  LLM_BASE_URL = "https://api.tensorx.ai/v1"
  LLM_MODEL = "z-ai/glm-5.3-flash"
  ASK_PER_HOUR = "40"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
